[project]
name = "rayride-api"
version = "0.3.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.135,<1",
    "numpy>=2,<3",
    "opencv-python-headless>=4.12,<5",
    "pillow>=13,<14",
    "pypdfium2>=5.15,<6",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.12,<3",
    "python-multipart>=0.0.34,<1",
    "sqlalchemy>=2.0.48,<2.1",
    "uvicorn>=0.41,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "pytest>=9,<10",
    "reportlab>=4.4,<5",
    "ruff>=0.15,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["ocr: runs the real Tesseract executable and English trained data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
