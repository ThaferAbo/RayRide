[project]
name = "rayride-api"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.135,<1",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.12,<3",
    "sqlalchemy>=2.0.48,<2.1",
    "uvicorn>=0.41,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "pytest>=9,<10",
    "ruff>=0.15,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
