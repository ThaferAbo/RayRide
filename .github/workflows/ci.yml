name: CSE491 checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.24"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Install Tesseract and English language data
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends tesseract-ocr tesseract-ocr-eng
          tesseract --version
          tesseract --list-langs | grep -x eng

      - name: Check API and OpenAPI contract
        working-directory: api
        env:
          RAYRIDE_REQUIRE_OCR_TESTS: "1"
        run: |
          uv sync --locked
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked python -m app.export_openapi --check
          uv run --locked pytest -q
          uv run --locked python -m scripts.evaluate_tickets

      - name: Check web app
        working-directory: frontend
        run: |
          npm ci
          npm run contracts:check
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Run browser reservation tests
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Smoke test the running API and web app
        run: |
          export RAYRIDE_DATABASE_PATH="$RUNNER_TEMP/rayride-smoke.sqlite3"
          export RAYRIDE_API_URL="http://127.0.0.1:8000"
          uv --directory api run --locked uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/rayride-api.log" 2>&1 &
          api_pid=$!
          npm --prefix frontend start > "$RUNNER_TEMP/rayride-web.log" 2>&1 &
          web_pid=$!
          cleanup() {
            local status=$?
            kill "$api_pid" "$web_pid" 2>/dev/null || true
            if [ "$status" -ne 0 ]; then
              cat "$RUNNER_TEMP/rayride-api.log" "$RUNNER_TEMP/rayride-web.log"
            fi
          }
          trap cleanup EXIT

          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 \
            "$RAYRIDE_API_URL/health" | jq -e '.status == "ok" and .database == "ready"'
          test -s "$RAYRIDE_DATABASE_PATH"
          curl --fail --silent --show-error --form 'ticket=@samples/scanned-ticket.pdf;type=application/pdf' \
            "$RAYRIDE_API_URL/api/v1/tickets/extract" | jq -e '.method == "ocr" and .arrival_airport.value == "AYT"'
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:3000/status > "$RUNNER_TEMP/rayride-web.html"
          grep -q 'The API responded and the database is ready.' "$RUNNER_TEMP/rayride-web.html"
